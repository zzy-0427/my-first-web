<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Vue Router 练习</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4"></script>
  <style>
    body { font-family: 微软雅黑; margin: 0; padding: 0; background: #f5f7fa; }
    .navbar {
      background: #4f7cff;
      padding: 14px 24px;
      display: flex;
      gap: 20px;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      padding: 4px 12px;
      border-radius: 4px;
      transition: background .2s;
    }
    .navbar a:hover { background: rgba(255,255,255,.2); }
    .navbar a.router-link-active { background: rgba(255,255,255,.3); font-weight: bold; }
    .page { max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h2 { color: #4f7cff; }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 导航栏 -->
    <nav class="navbar">
      <router-link to="/">首页</router-link>
      <router-link to="/todo">待办</router-link>
      <router-link to="/about">关于</router-link>
    </nav>

    <!-- 页面内容区 -->
    <div class="page">
      <router-view></router-view>
    </div>
  </div>

  <script>
    const { createApp } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    // 首页组件
    const Home = {
      template: `
        <div class="card">
          <h2>🏠 首页</h2>
          <p>欢迎来到我的第一个多页面Vue应用！</p >
          <p>今天是学IT第11天，正在学 Vue Router。</p >
        </div>
      `
    };

    // 待办组件
    const Todo = {
      template: `
        <div class="card">
          <h2>📝 待办</h2>
          <div style="display:flex;gap:8px;margin-bottom:16px;">
            <input v-model="inputText" placeholder="输入要做的事..." @keyup.enter="addTask"
                   style="flex:1;padding:8px;border:1px solid #ccc;border-radius:6px;">
            <button @click="addTask" style="padding:8px 16px;background:#4f7cff;color:white;border:none;border-radius:6px;cursor:pointer;">添加</button>
          </div>
          <ul style="list-style:none;padding:0;">
            <li v-for="(task, i) in tasks" :key="i" style="padding:8px 0;border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px;">
              <input type="checkbox" v-model="task.done">
              <span :style="task.done ? 'text-decoration:line-through;color:#bbb' : ''">{{ task.text }}</span>
            </li>
          </ul>
          <p style="color:#888;font-size:14px;margin-top:16px;">共 {{ tasks.length }} 条，已完成 {{ doneCount }} 条</p >
        </div>
      `,
      data() {
        return {
          inputText: "",
          tasks: [{ text: "学Vue Router", done: false }, { text: "做多页面网站", done: true }]
        };
      },
      computed: {
        doneCount() { return this.tasks.filter(t => t.done).length; }
      },
      methods: {
        addTask() {
          if (!this.inputText.trim()) return;
          this.tasks.push({ text: this.inputText, done: false });
          this.inputText = "";
        }
      }
    };

    // 关于组件
    const About = {
      template: `
        <div class="card">
          <h2>👤 关于</h2>
          <p>这是一个用 Vue 3 + Vue Router 做的练习项目。</p >
          <p>功能：多页面路由、待办增删改查、数据持久化。</p >
          <p>学习者：你（正在努力转行IT的人）</p >
        </div>
      `
    };

    // 路由配置
    const router = createRouter({
      history: createWebHashHistory(),
      routes: [
        { path: "/", component: Home },
        { path: "/todo", component: Todo },
        { path: "/about", component: About }
      ]
    });

    createApp({}).use(router).mount('#app');
  </script>
</body>
</html>
